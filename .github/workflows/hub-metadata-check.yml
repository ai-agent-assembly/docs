name: Hub metadata drift check

# Docs-hub component metadata gate (AAASM-4313 / Epic AAASM-4309).
#
# Fails the build if any hand-authored page under docs/src/ has drifted from
# hub-components.toml — i.e. if a maintainer edited a component table/list
# inside the BEGIN/END GENERATED:hub-components:* markers by hand instead of
# updating the manifest and regenerating. Runs the same command a contributor
# runs locally: `python3 docs/scripts/generate_hub_components.py --check`.
#
# It also runs the stale-repo-name audit (AAASM-4742): the same manifest is the
# source of canonical component names, and the audit fails on any retired
# pre-rename repo name (Epic AAASM-4341) left in tracked prose/config, and on a
# program-count that disagrees with the manifest's aggregated-component count.
#
# And it runs the compatibility-matrix drift gate (AAASM-4917 / ADR 0013): the
# core<->SDK matrix in docs/src/compatibility.md is generated from
# compatibility.toml, and this fails the build if the committed page has drifted
# from the manifest (`generate_compatibility.py --check`). This is the version-drift
# `--check` gate ADR 0013 Appendix B item 2 flagged as documented-but-unwired.
#
# And it runs the evaluator-guide drift gate (AAASM-5609): docs/src/what-ships-today.md
# and docs/src/choose-your-enforcement-path.md are generated from
# capability-surface.toml, a pinned extract of the AAASM-5531 capability manifest in
# the agent-assembly repository. This fails the build if either page has drifted from
# that extract (`generate_capability_surface.py --check`). Note the bound: this proves
# the GENERATED TABLES on those pages match the extract. It does not check prose
# outside the markers, and it does NOT prove the extract matches the upstream
# manifest — that needs a cross-repository check (see below).
#
# And it runs the capability & protection status table gate (AAASM-5600):
# docs/src/capability-status.md is generated from the same capability-surface.toml
# extract (`generate_capability_tables.py --check`), and any page under docs/src/
# that declares a `capability_ids` metadata field gets every id resolved against
# that same extract (`validate_capability_ids.py`) — an id that does not resolve
# fails CI. Both stay network-free in CI by reading the committed extract, the
# same reuse decision the evaluator-guide gate above already made; proving the
# EXTRACT itself still matches the LIVE upstream manifest is a cross-repository
# comparison this repo's CI does not make (`check_capability_surface_upstream.py`,
# run by hand — see that script's own docstring for why).
#
# And it runs the claim-vocabulary gate (AAASM-5797 / AAASM-5599): ADR 0033's
# banned-absolute and undifferentiated-verb rules, ported from agent-assembly's
# check_claim_vocabulary.py (AAASM-5679) and adapted to this repo's Markdown-only,
# no-front-matter corpus. The tree's blocking baseline is zero (confirmed by this
# same port's day-one run), so per claim-vocabulary.md's adoption sequence this
# runs full-tree, not diff-scoped -- `--diff-base` is for a repo still working
# down a non-empty baseline, which this one never had.
#
# And it runs the page-metadata validator (AAASM-5601): page-standards.md's own
# AA-PAGE-META contract -- field reference, the 15 cross-field rules, and the
# last_verified freshness thresholds (`validate_page_metadata.py`). Unlike the
# claim-vocabulary gate above, this one's baseline is NOT zero: rule 13 (an
# unbounded ADR 0033 §6 claim verb with no bounding metadata) fires on ~30
# pre-existing occurrences across pages AAASM-5610 has not yet migrated onto a
# metadata block. So this gate runs `--diff-base`, scoped exactly like
# check_claim_vocabulary.py's own (unused, here, because ITS baseline is zero)
# diff-scoping mechanism: only a NEW or MODIFIED violation blocks; a
# pre-existing one is still reported, just not blocking. See that script's own
# module docstring for why a page with no metadata block is not, by itself, an
# error -- rolling every page onto one is AAASM-5610's adoption work.
#
# See docs/scripts/generate_hub_components.py for the hub-component generator,
# docs/scripts/check_repo_names.py for the stale-name audit,
# docs/scripts/generate_compatibility.py for the compatibility-matrix generator,
# docs/scripts/check_claim_vocabulary.py for the claim-vocabulary gate,
# docs/scripts/validate_page_metadata.py for the page-metadata validator,
# and hub-components.toml / compatibility.toml for the manifest schemas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub-metadata-check:
    name: Verify hub component metadata is in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: validate_page_metadata.py's --diff-base scoping
          # (AAASM-5601) needs `git diff --merge-base` against the PR base /
          # pre-push SHA, which a shallow (depth-1) clone cannot compute.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # tomllib is standard-library from 3.11 onward; the aggregate.yml
          # workflow pins 3.12 for the same reason.
          python-version: "3.12"

      - name: Verify hub-components.toml drives docs/src/
        run: python3 docs/scripts/generate_hub_components.py --check

      - name: Audit tracked docs for stale pre-rename repo names
        run: python3 docs/scripts/check_repo_names.py --check

      - name: Verify compatibility.toml drives docs/src/compatibility.md
        run: python3 docs/scripts/generate_compatibility.py --check

      - name: Verify capability-surface.toml drives the evaluator guides
        run: python3 docs/scripts/generate_capability_surface.py --check

      - name: Verify capability-surface.toml drives the capability & protection status table
        run: python3 docs/scripts/generate_capability_tables.py --check

      - name: Validate every page's capability_ids against the capability manifest
        run: python3 docs/scripts/validate_capability_ids.py

      - name: Run hosted analytics privacy VM checks
        run: node docs/scripts/tests/analytics-privacy.test.mjs

      - name: Run the claim-vocabulary self-test
        run: python3 docs/scripts/check_claim_vocabulary.py --selftest

      - name: Check for banned-absolute and undifferentiated-verb claims
        run: python3 docs/scripts/check_claim_vocabulary.py --root .

      - name: Run the page-metadata validator's own test suite
        run: python3 docs/scripts/test_validate_page_metadata.py

      - name: Validate page metadata against page-standards.md (diff-scoped)
        env:
          # Base ref for the AAASM-5601 diff-scoping: the PR's base commit on a
          # pull_request event, the pre-push SHA on a push event. Neither is
          # free text -- both are commit SHAs GitHub itself supplies -- but
          # routed through env rather than inlined into `run:` regardless.
          DIFF_BASE_PR: ${{ github.event.pull_request.base.sha }}
          DIFF_BASE_PUSH: ${{ github.event.before }}
        run: |
          BASE="${DIFF_BASE_PR:-$DIFF_BASE_PUSH}"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE" 2>/dev/null; then
            python3 docs/scripts/validate_page_metadata.py --diff-base "$BASE"
          else
            # workflow_dispatch, or a base SHA this shallow-history checkout
            # doesn't actually have (e.g. force-push, new branch) -- fail
            # closed to full-tree validation rather than silently skip scoping.
            python3 docs/scripts/validate_page_metadata.py
          fi
